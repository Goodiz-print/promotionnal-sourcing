services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: promotionnal-sourcing-postgres
    environment:
      POSTGRES_DB: promotionnal-sourcing_dev
      POSTGRES_USER: promotionnal-sourcing
      POSTGRES_PASSWORD: promotionnal-sourcing
    ports:
      - '5430:5432'
    volumes:
      - promotionnal-sourcing_pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U promotionnal-sourcing -d promotionnal-sourcing_dev']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres_test:
    profiles: [test]
    image: pgvector/pgvector:pg18
    container_name: promotionnal-sourcing-postgres-test
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      # 5433 et non 5432 : le port par défaut est fréquemment occupé par un
      # autre projet, ce qui rendait ce service inutilisable sans bricolage.
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d test']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 local : remplace Cellar en dev (même API, mêmes variables CELLAR_*).
  # S3Mock n'impose ni authentification ni ACL : les objets sont lisibles
  # publiquement, comme sur le bucket Cellar. (MinIO n'est plus publié sur les
  # registres publics.)
  s3:
    image: adobe/s3mock:latest
    container_name: promotionnal-sourcing-s3
    # Le volume nommé est créé en root ; S3Mock tourne sinon en non-root et ne
    # peut pas y écrire (erreur 500 à la première requête).
    user: root
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: promotionnal-sourcing-dev
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    ports:
      - '9090:9090'
    volumes:
      - promotionnal-sourcing_s3_data:/data
    restart: unless-stopped

  # Image de production (même Dockerfile que le déploiement), en local. Les
  # variables viennent de `.env.compose` (non committé, cf. .env.compose.example).
  # Le compose surcharge seulement ce qui pointe vers les services locaux.
  migrate:
    build:
      context: .
      target: runtime
    image: promotionnal-sourcing:local
    profiles: [app]
    command: ['node', 'ace', 'migration:run', '--force']
    env_file: .env.compose
    environment: &app-env
      NODE_ENV: production
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: '5432'
      CELLAR_ENDPOINT: http://s3:9090
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    restart: 'no'

  web:
    build:
      context: .
      target: runtime
    image: promotionnal-sourcing:local
    profiles: [app]
    command: ['node', 'bin/server.js']
    env_file: .env.compose
    environment: *app-env
    ports:
      - '${WEB_PORT:-3333}:3333'
    healthcheck:
      # Pas de curl dans l'image : sonde HTTP `/health` (base joignable), codée en Node.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    image: promotionnal-sourcing:local
    profiles: [app]
    command: ['node', 'ace', 'queue:work']
    env_file: .env.compose
    environment: *app-env
    healthcheck:
      # Backlog en retard ou jobs figés : sortie 1 (cf. docs/queue.md).
      test: ['CMD', 'node', 'ace', 'queue:health']
      interval: 60s
      timeout: 30s
      start_period: 60s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  promotionnal-sourcing_pg_data:
  promotionnal-sourcing_s3_data:
