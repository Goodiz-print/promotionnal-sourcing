services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: promotionnal-sourcing-postgres
    environment:
      POSTGRES_DB: promotionnal-sourcing_dev
      POSTGRES_USER: promotionnal-sourcing
      POSTGRES_PASSWORD: promotionnal-sourcing
    ports:
      - '5430:5432'
    volumes:
      - promotionnal-sourcing_pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U promotionnal-sourcing -d promotionnal-sourcing_dev']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres_test:
    profiles: [test]
    image: pgvector/pgvector:pg18
    container_name: promotionnal-sourcing-postgres-test
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      # 5433 et non 5432 : le port par défaut est fréquemment occupé par un
      # autre projet, ce qui rendait ce service inutilisable sans bricolage.
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d test']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 local : remplace Cellar en dev (même API, mêmes variables CELLAR_*).
  # S3Mock n'impose ni authentification ni ACL : les objets sont lisibles
  # publiquement, comme sur le bucket Cellar. (MinIO n'est plus publié sur les
  # registres publics.)
  s3:
    image: adobe/s3mock:latest
    container_name: promotionnal-sourcing-s3
    # Le volume nommé est créé en root ; S3Mock tourne sinon en non-root et ne
    # peut pas y écrire (erreur 500 à la première requête).
    user: root
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: promotionnal-sourcing-dev
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    ports:
      - '9090:9090'
    volumes:
      - promotionnal-sourcing_s3_data:/data
    restart: unless-stopped

volumes:
  promotionnal-sourcing_pg_data:
  promotionnal-sourcing_s3_data:
