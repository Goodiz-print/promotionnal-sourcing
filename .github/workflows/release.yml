name: Release

# Mise en production : promeut l'image déjà construite et testée pour le commit
# tagué, sans reconstruction, après approbation de l'environnement `production`.
#
# - Tag `vX.Y.Z` poussé : nouvelle release.
# - Lancement manuel avec un tag existant : rollback (ou redéploiement) vers
#   cette version. Les migrations ne sont jamais annulées (docs/deploiement.md).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Version déjà publiée à redéployer (ex. v1.3.2)
        required: true
        type: string

jobs:
  resolve:
    name: Image de la version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Résoudre l'image
        id: image
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag invalide : $TAG (attendu vX.Y.Z)"
            exit 1
          fi

          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2> /dev/null | jq -r '.digest'
          }

          sha="$(git rev-list -n 1 "refs/tags/$TAG")"
          tag_digest="$(digest_of "$repository:$TAG" || true)"
          sha_digest="$(digest_of "$repository:$sha" || true)"

          if [ -z "$tag_digest" ]; then
            # Nouvelle version. Elle part d'un commit de main : c'est là que l'image a été testée.
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::Le tag $TAG ne pointe pas sur un commit de main."
              exit 1
            fi
            if [ -z "$sha_digest" ]; then
              echo "::error::Aucune image pour $sha : le workflow Docker n'est pas (encore) passé sur ce commit. Le relancer, puis relancer cette release."
              exit 1
            fi

            # Pose le tag de version sur l'image du commit : aucune reconstruction.
            docker buildx imagetools create --tag "$repository:$TAG" "$repository:$sha"
            tag_digest="$sha_digest"
          elif [ "$tag_digest" != "$sha_digest" ]; then
            # Version déjà publiée, mais le tag git ne désigne plus le même commit :
            # on refuse de redéployer en silence une image qui n'est pas celle du tag.
            echo "::error::L'image $TAG existe déjà et ne correspond pas au commit $sha du tag git (tag déplacé ?). Publier une nouvelle version plutôt que de déplacer un tag."
            exit 1
          fi

          {
            echo "image=$repository@$tag_digest"
            echo "version=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "Version $TAG (commit \`$sha\`) → \`$repository@$tag_digest\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs: resolve
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.resolve.outputs.image }}
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit
