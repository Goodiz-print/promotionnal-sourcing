name: Docker

# Après une CI verte sur main : construit l'image du commit testé, la pousse sur
# GHCR (une image par commit, taguée au SHA), puis la déploie en staging.
# La production réutilise cette image, sans reconstruction (release.yml).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Un run à la fois, dans l'ordre des merges : sans cela, le build d'un commit
# plus ancien peut finir après celui d'un plus récent et se déployer en dernier.
# Si trois merges s'enchaînent, le run en attente du milieu est annulé : son
# image n'existe pas (relancer ce run avant de taguer ce commit précis).
concurrency:
  group: docker-main
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `branches: [main]` filtre sur le NOM de la branche : la PR d'un fork dont la
    # branche s'appelle `main` le passerait. On exige donc un push sur main.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.name.outputs.repository }}@${{ steps.build.outputs.digest }}

    steps:
      # Le commit que la CI vient de valider, pas la tête de main au moment où
      # ce workflow démarre (un autre merge a pu passer entre-temps).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # GHCR refuse les majuscules, et le nom de l'organisation en contient.
      - name: Nom de l'image
        id: name
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.repository }}:latest
            ${{ steps.name.outputs.repository }}:${{ github.event.workflow_run.head_sha }}
          # Exposée par GET /health : permet de vérifier quelle version répond.
          build-args: |
            APP_VERSION=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Désactivé tant que la variable de dépôt DEPLOY_STAGING ne vaut pas `true`
  # (infrastructure Clever Cloud à créer d'abord : docs/deploiement-clever-setup.md).
  deploy-staging:
    needs: build-push
    if: ${{ vars.DEPLOY_STAGING == 'true' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.build-push.outputs.image }}
      version: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
