name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur une PR annule le run précédent (jamais sur main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_ENV: test
  TZ: UTC
  PORT: 3333
  HOST: localhost
  APP_NAME: fleetai
  APP_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  APP_URL: http://localhost:3333
  LOG_LEVEL: error
  QUEUE_DRIVER: sync
  LIMITER_STORE: memory
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: test
  DB_PASSWORD: test
  DB_DATABASE: test
  MISTRAL_API_KEY: test
  CELLAR_ENDPOINT: cellar.test
  CELLAR_BUCKET: test
  CELLAR_ACCESS_KEY_ID: test
  CELLAR_SECRET_ACCESS_KEY: test
  SMTP_HOST: localhost
  SMTP_PORT: 1025
  SMTP_SECURE: false
  MAIL_FROM_ADDRESS: noreply@fleetai.app
  MAIL_FROM_NAME: FleetAi

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Le build génère `.adonisjs/server/*` (#generated/*) dont dépend le typecheck.
      - run: pnpm run build
      - run: pnpm typecheck

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Backend tests (PostgreSQL)
        run: pnpm test

  # Jeu de requêtes de référence contre un vrai Elasticsearch (#112, ADR 0004) :
  # `pnpm test` l'ignore faute de ELASTICSEARCH_URL, ce job le rejoue seul. Mots-clés,
  # fautes et ET ; les requêtes sémantiques sont ignorées (elles demandent
  # l'API Mistral : à rejouer à la main avec une clé, `AI_EMBEDDINGS_ENABLED=true`).
  test-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELASTICSEARCH_URL: http://localhost:9200
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.1
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl --fail --silent http://localhost:9200/_cluster/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Jeu de référence (Elasticsearch)
        run: node ace test functional --files="tests/functional/search_reference.spec.ts"

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Frontend tests (Vitest)
        run: pnpm test:inertia

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Contrôles de l'image
        run: |
          test "$(docker run --rm --entrypoint id app:ci -u)" != 0
          test -z "$(docker run --rm --entrypoint sh app:ci -c 'find /app -name "*.ts" ! -name "*.d.ts" -o -name ".env*"' | grep -v '^/app/node_modules/')"
          docker run --rm --entrypoint gs app:ci --version
