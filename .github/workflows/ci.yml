name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur une PR annule le run précédent (jamais sur main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_ENV: test
  TZ: UTC
  PORT: 3333
  HOST: localhost
  APP_NAME: fleetai
  APP_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  APP_URL: http://localhost:3333
  LOG_LEVEL: error
  QUEUE_DRIVER: sync
  LIMITER_STORE: memory
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: test
  DB_PASSWORD: test
  DB_DATABASE: test
  MISTRAL_API_KEY: test
  CELLAR_ENDPOINT: cellar.test
  CELLAR_BUCKET: test
  CELLAR_ACCESS_KEY_ID: test
  CELLAR_SECRET_ACCESS_KEY: test
  SMTP_HOST: localhost
  SMTP_PORT: 1025
  SMTP_SECURE: false
  MAIL_FROM_ADDRESS: noreply@fleetai.app
  MAIL_FROM_NAME: FleetAi

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Le build génère `.adonisjs/server/*` (#generated/*) dont dépend le typecheck.
      - run: pnpm run build
      - run: pnpm typecheck

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Backend tests (PostgreSQL)
        run: pnpm test

  # Jeu de requêtes de référence contre un vrai Meilisearch (#112, ADR 0002) :
  # `pnpm test` l'ignore faute de MEILISEARCH_HOST, ce job le rejoue seul.
  test-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_API_KEY: ci-master-key
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.55.0
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ci-master-key
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl --fail --silent http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Jeu de référence (Meilisearch)
        run: node ace test functional --files="tests/functional/search_reference.spec.ts"

  # Même jeu, **avec l'embedder** : Meilisearch télécharge le modèle `huggingface`
  # (sans clé) et calcule les vecteurs, ce qui rejoue aussi les requêtes sémantiques.
  # Job à part : le téléchargement du modèle (~1 Go) dépend du réseau.
  test-search-semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_API_KEY: ci-master-key
      AI_EMBEDDINGS_ENABLED: true
      AI_PROVIDER: huggingface
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.55.0
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ci-master-key
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl --fail --silent http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Jeu de référence (Meilisearch + embedder huggingface)
        run: node ace test functional --files="tests/functional/search_reference.spec.ts"

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Frontend tests (Vitest)
        run: pnpm test:inertia

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Contrôles de l'image
        run: |
          test "$(docker run --rm --entrypoint id app:ci -u)" != 0
          test -z "$(docker run --rm --entrypoint sh app:ci -c 'find /app -name "*.ts" ! -name "*.d.ts" -o -name ".env*"' | grep -v '^/app/node_modules/')"
          docker run --rm --entrypoint gs app:ci --version
